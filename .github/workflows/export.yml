name: Export game

# Builds Windows, Linux and macOS versions of the game. It runs by hand from the Actions tab,
# and whenever a tag like v1.0.0 is pushed, in which case the builds are also attached to a
# GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7-stable"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The templates are 1.2 GB to download, so keep the few we need between runs.
      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/4.7.stable
          key: godot-${{ env.GODOT_VERSION }}-templates-v1

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          # Godot looks for export templates in a folder named <version>.<status>, with a dot.
          templates="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$HOME/godot-bin" "$templates"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          if [ ! -x "$HOME/godot-bin/godot" ]; then
            curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            unzip -q godot.zip -d "$HOME/godot-bin"
            mv "$HOME/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/godot-bin/godot"
            rm godot.zip
          fi
          if [ ! -f "$templates/version.txt" ]; then
            curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
            unzip -q -j templates.tpz \
              "templates/windows_release_x86_64.exe" "templates/linux_release.x86_64" \
              "templates/macos.zip" "templates/version.txt" -d "$templates"
            rm templates.tpz
          fi

      # Godot has to import every asset once before it can export them. It may exit non-zero on
      # harmless warnings, so a real failure shows up in the export step instead.
      - name: Import project
        run: '"$HOME/godot-bin/godot" --headless --path . --import || true'

      - name: Export Windows, Linux and macOS
        run: |
          set -euo pipefail
          godot="$HOME/godot-bin/godot"
          mkdir -p build/windows build/linux build/macos
          "$godot" --headless --path . --export-release "Windows Desktop" build/windows/midnight-magic.exe
          "$godot" --headless --path . --export-release "Linux" build/linux/midnight-magic.x86_64
          "$godot" --headless --path . --export-release "macOS" build/macos/midnight-magic.zip
          ls -lh build/*

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          chmod +x build/linux/midnight-magic.x86_64
          (cd build/windows && zip -q -r ../../dist/midnight-magic-windows.zip midnight-magic.exe)
          tar -C build/linux -czf dist/midnight-magic-linux.tar.gz midnight-magic.x86_64
          cp build/macos/midnight-magic.zip dist/midnight-magic-macos.zip
          ls -lh dist

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: midnight-magic
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
